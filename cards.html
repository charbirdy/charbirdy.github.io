<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            overflow: hidden;
            height: 300px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            backface-visibility: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            font-size: 1.2em;
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 1.1em;
            transform: rotateY(180deg);
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 30px;
            }

            .card {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Flashcards</h1>
        <div class="cards-grid">
            <!-- Card 1 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What is 2 + 2?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>4</div>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What is the capital of France?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>Paris</div>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What is H2O?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>Water</div>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>Who wrote Romeo and Juliet?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>William Shakespeare</div>
                    </div>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What is the largest planet?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>Jupiter</div>
                    </div>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What year did the Titanic sink?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>1912</div>
                    </div>
                </div>
            </div>

            <!-- Card 7 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What is the smallest prime number?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>2</div>
                    </div>
                </div>
            </div>

            <!-- Card 8 -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div>What does HTML stand for?</div>
                    </div>
                    <div class="card-face card-back">
                        <div>HyperText Markup Language</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
