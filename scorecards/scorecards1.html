  <script>
    // Get all score input cells and total cells
    const scoreInputs = document.querySelectorAll('input.score');
    const totalInputs = document.querySelectorAll('input.total');

    // Add event listeners to all score inputs
    scoreInputs.forEach((input) => {
      input.addEventListener('input', calculateTotals);
    });

    function calculateTotals() {
      // Get all rows
      const rows = document.querySelectorAll('tbody tr');

      rows.forEach((row) => {
        // Get all score inputs in this row
        const scores = row.querySelectorAll('input.score');
        // Get the total input in this row
        const totalInput = row.querySelector('input.total');

        // Calculate the sum
        let total = 0;
        scores.forEach((score) => {
          total += parseInt(score.value) || 0;
        });

        // Update the total field
        totalInput.value = total;
      });
    }
  </script>
