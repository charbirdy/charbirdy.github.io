<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>Game</h1>
      <nav class="nav-links" aria-label="Project navigation">
        <a href="projectmain.html" rel="noopener noreferrer">Main Page</a>
        <a href="project1.html" rel="noopener noreferrer">Meet The Members</a>
        <a href="project2.html" rel="noopener noreferrer">Meet The Coaches</a>
        <a href="project3.html" rel="noopener noreferrer">Team Schedule</a>
        <a href="project5.html" rel="noopener noreferrer">Join Us!</a>
      </nav>
    </header>

    <main>
      <div class="table-wrap">
        <table class="project-table" aria-label="Game scores">
          <thead>
            <tr>
              <th>Player</th>
              <th>1</th>
              <th>2</th>
              <th>3</th>
              <th>Final Score</th>
            </tr>
          </thead>
          <tbody>
            <!-- Keep inputs for manual scoring; total cells are readonly for clarity -->
            <tr>
              <td class="score-label"><input type="text" placeholder="Player 1" aria-label="Player 1 name"></td>
              <td><input type="number" placeholder="0" aria-label="Round 1 score"></td>
              <td><input type="number" placeholder="0" aria-label="Round 2 score"></td>
              <td><input type="number" placeholder="0" aria-label="Round 3 score"></td>
              <td><input type="number" placeholder="0" aria-label="Round 4 score"></td>
              <td class="total-cell"><input type="text" placeholder="0" aria-label="Total score" readonly></td>
            </tr>
            <!-- Repeat rows for other players -->
            <tr>
              <td class="score-label"><input type="text" placeholder="Player 2" aria-label="Player 2 name"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td class="total-cell"><input type="text" placeholder="0" readonly></td>
            </tr>
            <tr>
              <td class="score-label"><input type="text" placeholder="Player 3" aria-label="Player 3 name"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td class="total-cell"><input type="text" placeholder="0" readonly></td>
            </tr>
            <tr>
              <td class="score-label"><input type="text" placeholder="Player 4" aria-label="Player 4 name"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td><input type="number" placeholder="0"></td>
              <td class="total-cell"><input type="text" placeholder="0" readonly></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer style="margin-top:18px; text-align:center; color:#6b7280; font-size:14px;">&copy; Little Critters</footer>
  </div>
    <div class="fixed-box" role="button" aria-label="Meet the members button">
    <p><a href="projectmain.html" rel="noopener noreferrer">★ Back to Main</a></p>
  </div>
</body>
</html>
